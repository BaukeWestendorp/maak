[workspace]
resolver = "3"
members = [
    "lib/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
maak-config = { path = "lib/config" }
maak-ui = { path = "lib/ui" }
maak-watch = { path = "lib/watch" }

# errors
anyhow = "1.0"
thiserror = "2.0"

# serde
serde = "1.0"

# logging
log = "0.4"
pretty_env_logger = "0.5.0"


# other
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["font-kit"] }
